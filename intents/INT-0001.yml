uid: INT-0001
type: intent
status: approved
title: "Text sounds consistently formal and professional"
text: "A formal register signals seriousness, authority and respect for distance. It suits legal, regulatory, financial and official writing, where the reader expects the organisation to sound measured and impersonal. This axis governs register — how the writing sounds relative to the reader relationship — not readability, spelling or punctuation, each of which is a separate source. Register variants are mutually exclusive: a consumer composes exactly one of the formal, neutral or informal sibling sources."
